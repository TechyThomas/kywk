[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kywk"
version = "0.1.0"
description = "Optional PHP and Git task executables for Zed"
requires-python = ">=3.9"

[project.scripts]
kywk = "kywk:main"
kywk-php = "kywk_tasks:main_php"
kywk-git = "kywk_tasks:main_git"

[tool.setuptools]
py-modules = ["kywk_tasks", "kywk", "kywk_ssl"]
package-dir = {"" = "scripts"}
