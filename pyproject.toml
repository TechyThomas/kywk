[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kywk"
version = "0.1.0"
description = "Optional PHP and Git task executables for Zed"
requires-python = ">=3.9"

[project.scripts]
kywk = "kywk:main"
kywk-php = "php_docblocker:main_php"
kywk-git = "php_docblocker:main_git"

[tool.setuptools]
py-modules = ["php_docblocker", "kywk"]
package-dir = {"" = "scripts"}
